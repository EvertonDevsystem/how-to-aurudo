<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Meu Cartão de Apresentação - Alucard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        alucard: '#8B0000',
                        alucardEscuro: '#1A0000',
                        escuro: '#121212',
                        claro: '#F8F8F8',
                        destaque: '#B22222'
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    transitionTimingFunction: {
                        'suave': 'cubic-bezier(0.4, 0, 0.2, 1)',
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .texto-sombra {
                text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            }
            .sombra-card {
                box-shadow: 0 10px 30px rgba(139,0,0,0.3);
            }
            .borda-destaque {
                border: 3px solid #8B0000;
            }
            .backdrop-hack {
                transform: translateZ(0);
                -webkit-transform: translateZ(0);
            }
            .suave {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }
            .botao-link {
                @apply flex items-center justify-center gap-2 py-2.5 px-3 rounded-lg font-medium transition-all duration-200 ease-suave focus:outline-none focus:ring-2 focus:ring-alucard/50;
            }
        }
    </style>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        body {
            background-color: #F8F8F8;
            background: -webkit-gradient(linear, left top, left bottom, from(rgba(139, 0, 0, 0.15)), to(#F8F8F8));
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.15) 0%, #F8F8F8 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4 font-sans suave">

                </a>
            </div>
        </div>

        <div class="bg-alucardEscuro text-white text-center py-3 text-[clamp(0.75rem,2.5vw,0.875rem)]">
            <p>Desenvolvido com loucura e paciencia</p>
        </div>
    </div>

</body>
</html>
